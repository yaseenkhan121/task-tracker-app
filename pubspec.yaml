name: intern_task_tracker
description: "Internee Task Tracker - Production Enterprise Mobile Application for Internee.pk"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  fl_chart: ^0.70.2
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.1

  # Core Utilities & State
  intl: ^0.20.2
  uuid: ^4.5.1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Firebase Services
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
